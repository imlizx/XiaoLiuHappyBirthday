<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 20px 40px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 3rem;
            color: #ff6b6b;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 20px;
        }
        
        .birthday-cake {
            width: 220px;
            height: 180px;
            margin: 60px auto 0;
            position: relative;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }
        
        .cake {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .cake-layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px 10px 0 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .cake-layer.bottom {
            width: 200px;
            height: 60px;
            background: #f8b195;
        }
        
        .cake-layer.middle {
            width: 160px;
            height: 50px;
            background: #f67280;
            bottom: 60px;
        }
        
        .cake-layer.top {
            width: 120px;
            height: 40px;
            background: #c06c84;
            bottom: 110px;
        }
        
        .cake-icing {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 20px;
            background: #f9f871;
            border-radius: 50%;
        }
        
        .cake-decoration {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            border-radius: 50%;
        }
        
        .cake-decoration:nth-child(5) {
            bottom: 120px;
            left: 30%;
        }
        
        .cake-decoration:nth-child(6) {
            bottom: 130px;
            left: 45%;
        }
        
        .cake-decoration:nth-child(7) {
            bottom: 120px;
            left: 60%;
        }
        
        .cake-decoration:nth-child(8) {
            bottom: 140px;
            left: 35%;
        }
        
        .cake-decoration:nth-child(9) {
            bottom: 145px;
            left: 55%;
        }
        
        .cake-decoration:nth-child(10) {
            bottom: 80px;
            left: 25%;
        }
        
        .cake-decoration:nth-child(11) {
            bottom: 90px;
            left: 40%;
        }
        
        .cake-decoration:nth-child(12) {
            bottom: 80px;
            left: 55%;
        }
        
        .cake-decoration:nth-child(13) {
            bottom: 95px;
            left: 70%;
        }
        
        .cake-decoration:nth-child(14) {
            bottom: 40px;
            left: 30%;
        }
        
        .cake-decoration:nth-child(15) {
            bottom: 50px;
            left: 45%;
        }
        
        .cake-decoration:nth-child(16) {
            bottom: 40px;
            left: 60%;
        }
        
        .cake-decoration:nth-child(17) {
            bottom: 55px;
            left: 75%;
        }
        
        .candle {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 50px;
            background: linear-gradient(to bottom, #fff, #f0f0f0);
            border-radius: 6px 6px 0 0;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }
        
        .candle-wick {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 5px;
            background: #333;
        }
        
        .flame {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 30px;
            background: radial-gradient(circle, #ffd700 0%, #ff8c00 50%, #ff4500 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 1s infinite;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        
        @keyframes flicker {
            0%, 100% {
                transform: translateX(-50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translateX(-52%) scale(1.1) rotate(2deg);
                opacity: 0.9;
            }
            50% {
                transform: translateX(-48%) scale(1.05) rotate(-1deg);
                opacity: 0.8;
            }
            75% {
                transform: translateX(-51%) scale(1.15) rotate(1deg);
                opacity: 0.95;
            }
        }
        
        .message {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .message p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .gallery {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .gallery h2 {
            text-align: center;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .photo {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .photo:hover {
            transform: scale(1.05);
        }
        
        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .countdown {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .countdown h2 {
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        
        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .timer-item {
            text-align: center;
        }
        
        .timer-value {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: #ff6b6b;
        }
        
        .timer-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .music-player {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .birthday-cake {
                width: 180px;
                height: 150px;
                margin: 50px auto 0;
            }
            
            .cake-layer.bottom {
                width: 160px;
                height: 50px;
            }
            
            .cake-layer.middle {
                width: 130px;
                height: 40px;
                bottom: 50px;
            }
            
            .cake-layer.top {
                width: 100px;
                height: 35px;
                bottom: 90px;
            }
            
            .cake-icing {
                bottom: 125px;
                width: 115px;
                height: 15px;
            }
            
            .candle {
                width: 10px;
                height: 40px;
            }
            
            .flame {
                width: 15px;
                height: 25px;
            }
            
            .message p {
                font-size: 1rem;
            }
            
            .photo-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .photo {
                height: 150px;
            }
            
            .timer-value {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .birthday-cake {
                width: 150px;
                height: 125px;
                margin: 60px auto 0;
            }
            
            .cake-layer.bottom {
                width: 130px;
                height: 40px;
            }
            
            .cake-layer.middle {
                width: 105px;
                height: 35px;
                bottom: 40px;
            }
            
            .cake-layer.top {
                width: 80px;
                height: 30px;
                bottom: 75px;
            }
            
            .cake-icing {
                bottom: 105px;
                width: 90px;
                height: 12px;
            }
            
            .candle {
                width: 8px;
                height: 35px;
            }
            
            .flame {
                width: 12px;
                height: 20px;
            }
            
            .message {
                padding: 20px;
            }
            
            .gallery {
                padding: 20px;
            }
            
            .countdown {
                padding: 20px;
            }
            
            .photo-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 10px;
            }
            
            .photo {
                height: 120px;
            }
            
            .timer-value {
                font-size: 1.2rem;
            }
        }
        
        /* 动画效果 */
        .fade-in {
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 爱心动画 */
        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff6b6b;
            transform: rotate(45deg);
            animation: float 3s ease-in-out infinite;
        }
        
        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff6b6b;
            border-radius: 50%;
        }
        
        .heart::before {
            top: -10px;
            left: 0;
        }
        
        .heart::after {
            top: 0;
            left: -10px;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(45deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(45deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <header class="fade-in">
            <h1>小刘同学，生日快乐！</h1>
            <p class="subtitle">愿你得偿所愿平安喜乐万事胜意</p>
            <div class="birthday-cake">
            <div class="cake">
                <!-- 蛋糕底层 -->
                <div class="cake-layer bottom"></div>
                <!-- 蛋糕中层 -->
                <div class="cake-layer middle"></div>
                <!-- 蛋糕顶层 -->
                <div class="cake-layer top"></div>
                <!-- 蛋糕奶油 -->
                <div class="cake-icing"></div>
                <!-- 蛋糕装饰 -->
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <!-- 蜡烛 -->
                <div class="candle">
                    <div class="candle-wick"></div>
                    <div class="flame"></div>
                </div>
            </div>
        </div>
        </header>
        
        <section class="message fade-in">
            <p>亲爱的小刘：</p>
            <p>今天是你的生日，我想对你说</p>
            <p>谢谢你出现在我的生命里，给我带来快乐温暖和陪伴</p>
            <p>你的笑容是我见过最美的风景，你的声音是我听过最动听的旋律</p>
            <p>愿你在新的一岁里，身体健康，事业顺利，永远开心快乐</p>
            <p>一岁一礼，一寸欢喜，无事绊心弦，所念皆如愿</p>
            <p>生日快乐，我永远的小刘同学</p>
        </section>
        
        <section class="gallery fade-in">
            <h2>你的点点滴滴</h2>
            <div class="photo-grid">
                <div class="photo"><img src="xiaoliu1.jpg" alt="回忆1"></div>
                <div class="photo"><img src="xiaoliu22.jpg" alt="回忆2"></div>
                <div class="photo"><img src="xiaoliu33.jpg" alt="回忆3"></div>
                <div class="photo"><img src="xiaoliu44.jpg" alt="回忆4"></div>
            </div>
        </section>
        
        <section class="countdown fade-in">
            <h2>距离生日还有</h2>
            <div class="countdown-timer" id="countdownTimer">
                <div class="timer-item">
                    <span class="timer-value" id="days">00</span>
                    <span class="timer-label">天</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="hours">00</span>
                    <span class="timer-label">时</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="minutes">00</span>
                    <span class="timer-label">分</span>
                </div>
                <div class="timer-item">
                    <span class="timer-value" id="seconds">00</span>
                    <span class="timer-label">秒</span>
                </div>
            </div>
        </section>
        
        <section class="music-player fade-in">
            <h3>生日祝福歌</h3>
            <audio id="birthdayMusic" controls>
                <source src="BGM.m4a" type="audio/mpeg">
                您的浏览器不支持音频播放。
            </audio>
            <p id="playHint" style="margin-top: 10px; color: #666; font-size: 0.9rem;">点击播放按钮开始播放生日祝福歌</p>
        </section>
    </div>
    
    <footer>
        <p>爱你的人 ❤️</p>
    </footer>
    
    <script>
        // 生成爱心动画
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 3 + 's';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.opacity = Math.random() * 0.5 + 0.5;
                heart.style.transform = `translateY(100vh) rotate(45deg) scale(${Math.random() * 0.5 + 0.5})`;
                
                heartsContainer.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 300);
        }
        
        // 倒计时功能
        function startCountdown() {
            // 设置下一个生日日期（需要根据实际情况修改）
            const nextBirthday = new Date('2025-12-8');
            
            function updateCountdown() {
                const now = new Date();
                const diff = nextBirthday - now;
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                document.getElementById('days').textContent = days.toString().padStart(2, '0');
                document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
                document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
                document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            createHearts();
            startCountdown();
            
            const music = document.getElementById('birthdayMusic');
            const playHint = document.getElementById('playHint');
            
            // 音乐播放完成后停止
            music.addEventListener('ended', () => {
                music.pause();
                music.currentTime = 0;
            });
            
            // 尝试自动播放音乐，处理浏览器限制
            function tryPlayMusic() {
                music.play().then(() => {
                    // 播放成功，隐藏提示
                    if (playHint) {
                        playHint.style.display = 'none';
                    }
                }).catch(error => {
                    // 播放失败，显示提示，等待用户交互
                    console.log('自动播放失败，需要用户交互:', error);
                });
            }
            
            // 尝试自动播放
            tryPlayMusic();
            
            // 添加用户交互事件，当用户点击页面时自动播放
            document.addEventListener('click', () => {
                tryPlayMusic();
            });
            
            // 添加键盘事件，当用户按键时自动播放
            document.addEventListener('keydown', () => {
                tryPlayMusic();
            });
            
            // 添加触摸事件，当用户触摸页面时自动播放（移动端）
            document.addEventListener('touchstart', () => {
                tryPlayMusic();
            });
        });
    </script>
</body>
</html>
