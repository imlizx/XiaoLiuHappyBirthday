<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给小刘同学的生日祝福</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <header class="fade-in">
            <h1>小刘同学，生日快乐！</h1>
            <p class="subtitle">愿你得偿所愿平安喜乐万事胜意</p>
            <div class="birthday-cake">
            <div class="cake">
                <!-- 蛋糕底层 -->
                <div class="cake-layer bottom"></div>
                <!-- 蛋糕中层 -->
                <div class="cake-layer middle"></div>
                <!-- 蛋糕顶层 -->
                <div class="cake-layer top"></div>
                <!-- 蛋糕奶油 -->
                <div class="cake-icing"></div>
                <!-- 蛋糕装饰 -->
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <div class="cake-decoration"></div>
                <!-- 蜡烛 -->
                <div class="candle">
                    <div class="candle-wick"></div>
                    <div class="flame"></div>
                </div>
            </div>
        </div>
        </header>
        
        <section class="message fade-in">
            <p>亲爱的小刘：</p>
            <p>今天是你的生日，我想对你说</p>
            <p>谢谢你出现在我的生命里，给我带来快乐温暖和陪伴</p>
            <p>你的笑容是我见过最美的风景，你的声音是我听过最动听的旋律</p>
            <p>愿你在新的一岁里，身体健康，事业顺利，永远开心快乐</p>
            <p>一岁一礼，一寸欢喜，无事绊心弦，所念皆如愿</p>
            <p>生日快乐，我永远的小刘同学</p>
        </section>
        
        <section class="gallery fade-in">
            <h2>你的点点滴滴</h2>
            <div class="photo-grid">
                <div class="photo"><img src="xiaoliu1.jpg" alt="回忆1" loading="lazy" onclick="openModal(this)"></div>
                <div class="photo"><img src="xiaoliu2.jpg" alt="回忆2" loading="lazy" onclick="openModal(this)"></div>
                <div class="photo"><img src="xiaoliu3.jpg" alt="回忆3" loading="lazy" onclick="openModal(this)"></div>
                <div class="photo"><img src="xiaoliu4.jpg" alt="回忆4" loading="lazy" onclick="openModal(this)"></div>
            </div>
        </section>
        
        <section class="countdown fade-in">
            <h2 id="countdownTitle">距离生日还有</h2>
            <div class="countdown-timer" id="countdownTimer">
                <div class="timer-item" id="daysContainer">
                    <span class="timer-value" id="days">00</span>
                    <span class="timer-label">天</span>
                </div>
                <div class="birthday-wish" id="birthdayWish" style="display: none;">
                    <h3>🎉 今天生日啦 🎉</h3>
                    <p class="wish-text">世间所有美好与你环环相扣</p>
                </div>
            </div>
        </section>
        
        <section class="music-player fade-in">
            <h3>生日祝福歌</h3>
            <audio id="birthdayMusic" controls>
                <source src="BGM.m4a" type="audio/mpeg">
                您的浏览器不支持音频播放。
            </audio>
            <p id="playHint" style="margin-top: 10px; color: #666; font-size: 0.9rem;">点击播放按钮开始播放生日祝福歌</p>
        </section>
    </div>
    
    <!-- 图片预览模态框 -->
    <div class="modal" id="imageModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <span class="close" id="closeModal" style="position: absolute; top: 20px; right: 30px; color: white; font-size: 30px; font-weight: bold; cursor: pointer; transition: transform 0.3s ease;">&times;</span>
        <img class="modal-content" id="modalImage" style="max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
        <div class="caption" id="imageCaption" style="text-align: center; color: white; margin-top: 15px; font-size: 1.1rem;"></div>
    </div>
    
    <footer>
        <p>爱你的人 ❤️</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
